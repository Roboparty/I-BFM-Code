ROBOT_TYPE: g1_real
DOMAIN_ID: 0
CONTROL_BACKEND: unitree_sdk2py
# Workstation Ethernet NIC dedicated to the G1 DDS network. Override with
# G1_INTERFACE if the interface name differs on another computer.
INTERFACE: enp131s0
ORIN_HOST: 192.168.123.164
MOTOR_CONTROLLER_HOST: 192.168.123.161

# Both this switch and UFO_ALLOW_LOW_LEVEL_COMMANDS=1 are required before a
# LowCmd publisher can be created. Keep false during installation/diagnostics.
ENABLE_LOW_LEVEL_COMMANDS: false
# Releasing the stock motion service changes robot state. Keep false until the
# suspended-robot commissioning step and enable it separately from LowCmd.
RELEASE_MOTION_SERVICE: false
LOW_STATE_TOPIC: rt/lowstate
LOW_CMD_TOPIC: rt/lowcmd
LOW_STATE_TIMEOUT_MS: 100
LOW_COMMAND_RATE_HZ: 500
LOW_COMMAND_TIMEOUT_MS: 100
LOW_COMMAND_DAMPING_KD: 1.0
USE_JOYSTICK: true
Q_TARGET_SLEW_SAFETY_FACTOR: 0.35

UNITREE_LEGGED_CONST:
  HIGHLEVEL: 0xEE
  LOWLEVEL: 0xFF
  TRIGERLEVEL: 0xF0
  PosStopF: 2146000000.0
  VelStopF: 16000.0
  MODE_MACHINE: 5
  MODE_PR: 0

