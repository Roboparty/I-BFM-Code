robot_config: configs/robots/g1_29dof.yaml

datasets:
  # Source-level sampling weights. Motion counts do not alter the 30:40:30
  # probability mass enforced by the mixed-source motion sampler.
  - name: g1_lafan
    format: ufo_pkl
    train_path: ../../humanoidverse/data/lafan_29dof_10s-clipped.pkl
    weight: 0.3

  - name: g1_carry_box_omniretarget_no_foot
    format: ufo_pkl
    train_path: ../../cache/motion_data/g1_carry_box_omniretarget_no_foot/g1_carry_box_omniretarget_no_foot_train_near10s_grounded_mujoco_hysteresis_4p5_6cm_ufo.pkl
    inference_path: ../../cache/motion_data/g1_carry_box_omniretarget_no_foot/g1_carry_box_omniretarget_no_foot_full_grounded_mujoco_hysteresis_4p5_6cm_ufo.pkl
    weight: 0.4

  - name: g1_kick_box_omniretarget
    format: ufo_pkl
    train_path: ../../cache/motion_data/g1_kick_box_omniretarget/g1_kick_box_omniretarget_train_near10s_grounded_mujoco_hysteresis_4p5_6cm_ufo.pkl
    inference_path: ../../cache/motion_data/g1_kick_box_omniretarget/g1_kick_box_omniretarget_full_grounded_mujoco_hysteresis_4p5_6cm_ufo.pkl
    weight: 0.3
