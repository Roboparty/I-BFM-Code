onnx_providers: [CUDAExecutionProvider]
require_onnx_provider: CUDAExecutionProvider
# Warm the CUDA provider and kernels in this same process before the 50 Hz loop.
# The synthetic output is validated and discarded; it is never sent to G1.
onnx_warmup_runs: 20
onnx_warmup_tail_latent_dim: 256
# Match the corresponding MuJoCo action path exactly. Joint limits, finite
# checks, stop latch, and safe hold remain active in the deployment runtime.
q_target_slew_safety_factor: 0.0

observation: {}
action_rescale: 5.0
action_scale:
  left_hip_pitch_joint: 0.35066146
  left_hip_roll_joint: 0.35066146
  left_hip_yaw_joint: 0.54754644
  left_knee_joint: 0.35066146
