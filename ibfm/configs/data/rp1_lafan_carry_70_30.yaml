robot_config: configs/robots/rp1_28dof.yaml

datasets:
  - name: rp1_lafan_h200_v2
    format: robot_state_npz
    source_path: ../../data/rp1_lafan_h200_v2/*.npz
    weight: 0.7
    auto_build:
      train_clip_seconds: 10.0
      clip_stride_seconds: 10.0
      keep_short: true
      min_clip_seconds: 1.0

  - name: rp1_carry_box_grounded
    format: hhtools_carry_csv
    source_path: ../../data/rp1_carry_box_hhtools_contact_grounded
    weight: 0.3
    auto_build:
      train_clip_seconds: 10.0
      clip_stride_seconds: 10.0
      keep_short: true
      min_clip_seconds: 1.0
